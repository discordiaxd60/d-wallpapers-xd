name: Build APT Repository

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build .deb package and APT Repo
        run: |
          mkdir -p public/pool/main
          mkdir -p build_pkg/DEBIAN
          mkdir -p build_pkg/usr/share/wallpapers/dlinesos

          if [ -d "src-wallpapers" ]; then
            cp -r src-wallpapers/* build_pkg/usr/share/wallpapers/dlinesos/ 2>/dev/null || true
          fi

          cat <<EOF > build_pkg/DEBIAN/control
          Package: dlinesos-wallpapers
          Version: 1.0.${{ github.run_number }}
          Section: graphics
          Priority: optional
          Architecture: all
          Maintainer: D-Brand Team
          Description: Sfondi ufficiali per D-LinesOS-XD
          EOF

          dpkg-deb --build build_pkg dlinesos-wallpapers.deb
          mv dlinesos-wallpapers.deb public/pool/main/

          cd public
          dpkg-scanpackages pool/main /dev/null > Packages
          gzip -k -f Packages

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4