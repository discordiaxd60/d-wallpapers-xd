name: Build APT Repository

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build .deb package and APT Repo
        run: |
          # 1. Create the temporary package structure
          mkdir -p build_pkg/DEBIAN
          mkdir -p build_pkg/usr/share/wallpapers/dlinesos

          # 2. Copy the wallpaper files
          if [ -d "src-wallpapers" ]; then
            cp -r src-wallpapers/* build_pkg/usr/share/wallpapers/dlinesos/ 2>/dev/null || true
          fi

          # 3. Write the required Debian control file
          cat <<EOF > build_pkg/DEBIAN/control
          Package: dlinesos-wallpapers
          Version: 1.0.${{ github.run_number }}
          Section: graphics
          Priority: optional
          Architecture: all
          Maintainer: D-Brand Team
          Description: Official wallpapers for D-LinesOS-XD
          EOF

          # 4. Build the wallpaper package
          dpkg-deb --build build_pkg dlinesos-wallpapers.deb

          # 5. Create the APT repository directory
          mkdir -p public/pool/main

          mv dlinesos-wallpapers.deb public/pool/main/

          # 6. Generate the package index
          cd public
          dpkg-scanpackages pool/main /dev/null > Packages
          gzip -k -f Packages
          cd ..

          ls -la public/
          ls -la public/pool/main/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4