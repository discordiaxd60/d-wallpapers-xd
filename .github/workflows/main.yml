name: Build Linux Repositories

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test generic Linux installer
        run: |
          mkdir -p "$RUNNER_TEMP/wallpaper-install-test"
          printf '[Desktop Entry]\nName=D-LinesOS Wallpapers\nX-KDE-PluginInfo-Name=dlinesos\nX-KDE-PluginInfo-Author=D-Brand Team\n' \
            > "$RUNNER_TEMP/wallpaper-install-test/metadata.desktop"
          printf '{\n  "schema_version": 1,\n  "images": [\n' \
            > "$RUNNER_TEMP/wallpaper-install-test/catalog.json"
          for package_root in \
            "$RUNNER_TEMP" \
            "$RUNNER_TEMP/wallpaper-install-test-kde"
          do
            package_dir="$package_root/dlinesos-old-test"
            mkdir -p "$package_dir"
            printf '{\n  "KPackageStructure": "Wallpaper/Images",\n  "KPlugin": {\n    "Id": "dlinesos-old-test",\n' \
              > "$package_dir/metadata.json"
          done
          sh scripts/install-wallpapers.sh "$RUNNER_TEMP/wallpaper-install-test"
          test ! -e "$RUNNER_TEMP/wallpaper-install-test/metadata.desktop"
          test ! -e "$RUNNER_TEMP/wallpaper-install-test-kde"
          test ! -e "$RUNNER_TEMP/dlinesos-old-test"
          test ! -e "$RUNNER_TEMP/wallpaper-install-test/catalog.json"
          diff -r src-wallpapers "$RUNNER_TEMP/wallpaper-install-test"
          if find "$RUNNER_TEMP/wallpaper-install-test" -type f \
            \( -name '*.json' -o -name '*.desktop' -o -name '*.xml' \) \
            -print -quit | grep -q .; then
            echo "Installer left metadata in the wallpaper destination."
            exit 1
          fi

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm createrepo-c

      - name: Build .deb package and APT Repo
        run: |
          # 1. Create the temporary package structure
          mkdir -p build_pkg/DEBIAN
          mkdir -p build_pkg/usr/share/wallpapers/dlinesos

          # 2. Copy the wallpaper files
          cp -a src-wallpapers/. build_pkg/usr/share/wallpapers/dlinesos/

          # 3. Write the required Debian control file
          cat <<EOF > build_pkg/DEBIAN/control
          Package: dlinesos-wallpapers
          Version: 1.0.${{ github.run_number }}
          Section: graphics
          Priority: optional
          Architecture: all
          Maintainer: D-Brand Team
          Description: Official wallpapers for D-LinesOS-XD
          EOF

          # 4. Build the wallpaper package
          dpkg-deb --build build_pkg dlinesos-wallpapers.deb

          # 5. Create the APT repository directory
          mkdir -p public/pool/main

          mv dlinesos-wallpapers.deb public/pool/main/

          # 6. Generate the package index
          cd public
          dpkg-scanpackages pool/main /dev/null > Packages
          gzip -k -f Packages
          cd ..

          if dpkg-deb --contents public/pool/main/dlinesos-wallpapers.deb \
            | grep -E '\.(json|desktop|xml)$'; then
            echo "Debian package unexpectedly contains wallpaper metadata."
            exit 1
          fi
          test -s public/Packages.gz

          ls -la public/
          ls -la public/pool/main/

      - name: Build RPM and Fedora repository
        run: |
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar -czf "$HOME/rpmbuild/SOURCES/dlinesos-wallpapers-1.0.tar.gz" \
            --transform='s,^,dlinesos-wallpapers-1.0/,' LICENSE src-wallpapers
          rpmbuild -bb \
            --define "_topdir $HOME/rpmbuild" \
            --define "release_number $GITHUB_RUN_NUMBER" \
            packaging/dlinesos-wallpapers.spec

          mkdir -p public/fedora
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} public/fedora/ \;
          createrepo_c public/fedora
          if rpm -qlp public/fedora/*.rpm | grep -E '\.(json|desktop|xml)$'; then
            echo "RPM package unexpectedly contains wallpaper metadata."
            exit 1
          fi
          test -s public/fedora/repodata/repomd.xml

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4