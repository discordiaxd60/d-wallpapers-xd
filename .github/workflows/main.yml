name: Build APT Repository

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils python3-pil python3-pil.imagetk python3-tk

      - name: Validate app and wallpaper metadata
        run: |
          python3 -m py_compile app/d_gallery_xd.py
          PYTHONPATH=app python3 -c 'from PIL import ImageTk; from d_gallery_xd import load_wallpapers; wallpapers = load_wallpapers(); assert wallpapers; print(f"Validated ImageTk and {len(wallpapers)} wallpapers")'

      - name: Build packages and APT repository
        run: |
          version="1.0.${{ github.run_number }}"

          mkdir -p build/wallpapers/DEBIAN
          mkdir -p build/wallpapers/usr/share/wallpapers/dlinesos
          cp -a src-wallpapers/. build/wallpapers/usr/share/wallpapers/dlinesos/

          cat > build/wallpapers/DEBIAN/control <<EOF
          Package: dlinesos-wallpapers
          Version: ${version}
          Section: graphics
          Priority: optional
          Architecture: all
          Maintainer: D-Brand Team
          Description: Official D-LinesOS-XD wallpaper collection
          EOF

          mkdir -p build/gallery/DEBIAN
          mkdir -p build/gallery/usr/bin
          mkdir -p build/gallery/usr/lib/d-gallery-xd
          mkdir -p build/gallery/usr/share/applications
          mkdir -p build/gallery/usr/share/icons/hicolor/scalable/apps
          install -m 0644 app/d_gallery_xd.py build/gallery/usr/lib/d-gallery-xd/d_gallery_xd.py
          install -m 0644 app/d-gallery-xd.desktop build/gallery/usr/share/applications/
          install -m 0644 app/d-gallery-xd.svg build/gallery/usr/share/icons/hicolor/scalable/apps/
          cat > build/gallery/usr/bin/d-gallery-xd <<'EOF'
          #!/bin/sh
          exec /usr/bin/python3 /usr/lib/d-gallery-xd/d_gallery_xd.py "$@"
          EOF
          chmod 0755 build/gallery/usr/bin/d-gallery-xd

          cat > build/gallery/DEBIAN/control <<EOF
          Package: d-gallery-xd
          Version: ${version}
          Section: graphics
          Priority: optional
          Architecture: all
          Maintainer: D-Brand Team
          Depends: dlinesos-wallpapers (= ${version}), python3, python3-pil, python3-pil.imagetk, python3-tk
          Description: Desktop gallery for D-LinesOS-XD wallpapers
          EOF

          dpkg-deb --build build/wallpapers dlinesos-wallpapers.deb
          dpkg-deb --build build/gallery d-gallery-xd.deb

          mkdir -p public/pool/main
          mv dlinesos-wallpapers.deb d-gallery-xd.deb public/pool/main/
          cd public
          dpkg-scanpackages --multiversion pool/main /dev/null > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4